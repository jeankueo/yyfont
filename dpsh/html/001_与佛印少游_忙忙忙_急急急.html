<h1>与佛印少游_忙忙忙_急急急</h1>
<pre>东坡留佛印小饮，适山谷亦至。未几，佛印告辞。坡公问：“甚事忙？”佛印答以：“小便忙。”坡公即行一忙字令曰：
我有百亩田，全无一叶秧。
夏时已将半，问君忙不忙？
山谷曰：
我有百筐蚕，全无一叶桑。
春色已将半，问君忙不忙？
佛印曰：
和尚养婆娘，相逢正上牀。
夫主门外叫，问君忙不忙？
东坡又行一急字令，佛印曰：“请道。”
东坡曰：
急急急，穿靴水上立，走马到安邑；
走马却回来，　　　　靴尖犹未湿。
山谷曰：
急急急，连箭射粉墙，走马到南场，
走马却回来，　　　　箭头未点墙。
佛印曰：
急急急，娘子放个屁，走马到西市，
走马却回来，　　　　屁门犹未闭。</pre>
