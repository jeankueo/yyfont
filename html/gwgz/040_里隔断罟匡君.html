<h1>里隔断罟匡君</h1>
<pre>宣公夏滥于泗渊，里革断其罟而弃之，曰：“古者大寒降，土蛰发，水虞于是乎讲罛罶，取名鱼，登川禽，而尝之寝庙，行诸国人，助宣气也。鸟兽孕，水虫成，兽虞于是乎禁罝罗，矠鱼鳖以为夏槁，助生阜也。鸟兽成，水虫孕，水虞于是乎禁罝{罒鹿}，设阱鄂，以实庙庖，畜功用也。且夫山不槎蘖，泽不伐夭，鱼禁鲲鲕，兽长麑{鹿夭}，鸟翼鷇卵，虫舍蚳蝝，蕃庶物也，古之训也。
今鱼方别孕，不教鱼长，又行网罟，贪无艺也。”
公闻之曰：“吾过而里革匡我，不亦善乎！是良罟也，为我得法。使有司藏之，使吾无忘谂。”师存侍，曰：“藏罟不如置里革于侧之不忘也。”</pre>
