<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可心积分</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #f5f6fa;
      --color-surface: #ffffff;
      --color-border: #e6e8f0;
      --color-text: #1a1a2e;
      --color-muted: #6b7280;
      --color-accent: #5b5ea6;
      --color-accent-light: #ededf8;
      --color-green: #16a34a;
      --color-green-light: #dcfce7;
      --color-amber: #d97706;
      --color-amber-light: #fef3c7;
      --color-red: #dc2626;
      --color-red-light: #fee2e2;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      font-size: 15px;
    }

    header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--color-accent); }
    header .updated { margin-left: auto; font-size: 12px; color: var(--color-muted); }
    header .lang-link {
      margin-left: 16px; font-size: 12px; color: var(--color-accent);
      text-decoration: none; border: 1px solid var(--color-accent);
      border-radius: 10px; padding: 2px 10px;
      background: none; cursor: pointer;
    }
    header .lang-link:hover { background: var(--color-accent-light); }

    .scroll-body { max-height: 320px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .scroll-body thead th { position: sticky; top: 0; z-index: 1; }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-card .label { font-size: 13px; color: var(--color-muted); margin-bottom: 4px; }
    .stat-card .value { font-size: 36px; font-weight: 700; line-height: 1.1; }
    .stat-card.total .value  { color: var(--color-accent); }
    .stat-card.avail .value  { color: var(--color-green); }
    .stat-card.avail.negative .value { color: var(--color-red); }

    section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: clip;
    }
    .section-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header h2 { font-size: 15px; font-weight: 600; }
    .section-header .badge {
      margin-left: auto;
      font-size: 12px;
      background: var(--color-accent-light);
      color: var(--color-accent);
      border-radius: 12px;
      padding: 2px 10px;
      font-weight: 600;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    .rule-cell {
      padding: 16px 20px;
      border-right: 1px solid var(--color-border);
    }
    .rule-cell:last-child { border-right: none; }
    .rule-cell .rule-title { font-size: 12px; color: var(--color-muted); margin-bottom: 6px; }
    .rule-cell .rule-formula { font-size: 14px; font-weight: 600; color: var(--color-text); }
    .rule-cell .rule-note { font-size: 12px; color: var(--color-muted); margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--color-muted);
      border-bottom: 1px solid var(--color-border);
      background: #fafbfc;
    }
    tbody tr { border-bottom: 1px solid var(--color-border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 10px 16px; font-size: 14px; }
    tbody tr:hover { background: #fafbfc; }

    .pts-chip {
      display: inline-block;
      background: var(--color-accent-light);
      color: var(--color-accent);
      border-radius: 10px;
      padding: 1px 9px;
      font-size: 13px;
      font-weight: 600;
    }
    .pts-chip.redeem { background: var(--color-red-light);   color: var(--color-red); }
    .pts-chip.bonus  { background: var(--color-green-light); color: var(--color-green); }

    .loading { padding: 32px; text-align: center; color: var(--color-muted); }
    .error   { padding: 20px; color: var(--color-red); }

    .img-icon { color: var(--color-muted); margin-left: 5px; vertical-align: middle; text-decoration: none; }
    .img-icon:hover { color: var(--color-accent); }
    .name-cell a { color: var(--color-accent); text-decoration: none; }
    .name-cell a:hover { text-decoration: underline; }
    .book-link { text-decoration: none; }
    .book-link:hover .tag { opacity: 0.75; }
    .time-cell { color: var(--color-muted); font-size: 13px; white-space: nowrap; }
    .tag {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 8px;
      font-weight: 600;
    }
    .tag-book    { background: #e0f2fe; color: #0369a1; }
    .tag-halfday { background: var(--color-amber-light); color: var(--color-amber); }

    #modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #modal-backdrop.hidden { display: none; }
    #modal-box {
      background: var(--color-surface);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
      width: min(820px, 92vw);
      height: 78vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #modal-header {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 6px 10px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    #modal-close {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: var(--color-muted);
      line-height: 1; padding: 2px 8px; border-radius: 4px;
    }
    #modal-close:hover { background: var(--color-border); color: var(--color-text); }
    #modal-frame { flex: 1; border: none; width: 100%; }
    #modal-img   { flex: 1; width: 100%; object-fit: contain; display: none; background: var(--color-bg); }
    #modal-canvas { flex: 1; display: none; position: relative; background: var(--color-bg); overflow: hidden; }
    #modal-canvas img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #modal-canvas .layer-handin { mix-blend-mode: multiply; }
    #modal-text  { flex: 1; overflow-y: auto; padding: 20px 28px; margin: 0; display: none;
                   background: var(--color-bg); color: var(--color-text);
                   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
                   font-size: 15px; line-height: 2; white-space: pre-wrap; word-break: break-all; }
    .tag-hour    { background: var(--color-green-light); color: var(--color-green); }
    .tag-point   { background: var(--color-accent-light); color: var(--color-accent); }

    @media (max-width: 600px) {
      .rules-grid { grid-template-columns: 1fr; }
      .rule-cell { border-right: none; border-bottom: 1px solid var(--color-border); }
      .rule-cell:last-child { border-bottom: none; }
      .summary-bar { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="page-title">可心积分</h1>
  <span class="updated" id="updated-time"></span>
  <a id="lang-toggle" class="lang-link" href="#" onclick="toggleLang();return false">English</a>
  <a class="lang-link" href="https://github.com/jeankueo/yyfont" target="_blank">GitHub</a>
</header>

<main>
  <div id="root"><div class="loading" id="loading-text">加载中…</div></div>
</main>

<div id="modal-backdrop" class="hidden">
  <div id="modal-box">
    <div id="modal-header"><button id="modal-close" title="关闭 (Esc)">×</button></div>
    <iframe id="modal-frame" src="about:blank"></iframe>
    <img id="modal-img" src="" alt="">
    <div id="modal-canvas">
      <img class="layer-handout" src="" alt="">
      <img class="layer-handin"  src="" alt="">
    </div>
    <pre id="modal-text"></pre>
  </div>
</div>

<script>
const T = {
  zh: {
    title: '可心积分',
    loading: '加载中…',
    error: e => `无法加载 font/points.json（${e}）`,
    updatedAt: d => `更新于 ${d}`,
    langToggle: 'English',
    closeModal: '关闭 (Esc)',
    stats: { total: '累计积分', available: '可用积分' },
    rules: {
      header: '积分规则',
      cells: [
        { title: '抄写', formula: '每字 1 分',
          notes: ['根据字帖行宽统计完成字数'] },
        { title: '阅读', formula: '⌈字数 ÷ 20⌉ 分',
          notes: ['有余数则进一，最少 1 分'] },
        { title: '兑换', formula: '半天 60 分 · 每小时 36 分',
          notes: ['工作日每周最多累计 2 小时', '周末每周最多兑换一次半天',
                  {text: '↳ 16 点起批准全天', style: 'padding-left:8px'}] },
        { title: '不定期奖励', formula: '由家长决定',
          notes: ['表现优秀或完成特别任务', '积分数量视情况而定'] },
      ],
    },
    font: {
      header: '抄写记录',
      badge: (n, t) => `${n} 次 · 共 ${t} 分`,
      cols: ['课文', '书', '时间', '积分'],
      empty: '暂无记录',
    },
    read: {
      header: '阅读记录',
      badge: (n, t) => `${n} 篇 · 共 ${t} 分`,
      cols: ['课文', '书', '时间', '字数', '积分'],
      chars: n => `${n} 字`,
      empty: '暂无记录',
    },
    redeem: {
      header: '游戏时间兑换',
      badge: (n, t) => `${n} 次 · 共 ${t} 分`,
      cols: ['时间', '说明', '积分'],
      empty: '暂无记录',
      tags: { bonus: '奖励', halfday: '半天', hour: h => `${h}小时`, point: '积分' },
    },
  },
  en: {
    title: 'Kexin Points',
    loading: 'Loading…',
    error: e => `Failed to load font/points.json (${e})`,
    updatedAt: d => `Updated ${d}`,
    langToggle: '中文',
    closeModal: 'Close (Esc)',
    stats: { total: 'Total Points', available: 'Available' },
    rules: {
      header: 'Scoring Rules',
      cells: [
        { title: 'Calligraphy', formula: '1 pt per character',
          notes: ['Counted by characters completed per page'] },
        { title: 'Reading', formula: '⌈characters ÷ 20⌉ pts',
          notes: ['Rounded up; minimum 1 pt'] },
        { title: 'Redeem', formula: 'Half-day: 60 pts · Per hour: 36 pts',
          notes: ['Weekdays: max 2 hrs cumulative per week', 'Weekends: max one half-day per week',
                  {text: '↳ Approved for the rest of the day from 4:00 PM', style: 'padding-left:8px'}] },
        { title: 'Bonus', formula: "At parent's discretion",
          notes: ['For outstanding behavior or special tasks', 'Points vary case by case'] },
      ],
    },
    font: {
      header: 'Calligraphy Log',
      badge: (n, t) => `${n} sessions · ${t} pts`,
      cols: ['Lesson', 'Book', 'Date', 'Points'],
      empty: 'No entries yet',
    },
    read: {
      header: 'Reading Log',
      badge: (n, t) => `${n} texts · ${t} pts`,
      cols: ['Text', 'Book', 'Date', 'Characters', 'Points'],
      chars: n => `${n} chars`,
      empty: 'No entries yet',
    },
    redeem: {
      header: 'Game Time Redemption',
      badge: (n, t) => `${n} redemptions · ${t} pts`,
      cols: ['Date', 'Note', 'Points'],
      empty: 'No entries yet',
      tags: { bonus: 'bonus', halfday: 'half-day', hour: h => `${h}h`, point: 'pts' },
    },
  },
};

let lang = new URLSearchParams(location.search).get('lang')
  || localStorage.getItem('lang')
  || (navigator.language.startsWith('zh') ? 'zh' : 'en');
let lastData = null;

function applyLang(l) {
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
  document.title = T[l].title;
  document.getElementById('page-title').textContent = T[l].title;
  document.getElementById('lang-toggle').textContent = T[l].langToggle;
  document.getElementById('modal-close').title = T[l].closeModal;
  const loadingEl = document.getElementById('loading-text');
  if (loadingEl) loadingEl.textContent = T[l].loading;
}

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', lang);
  const url = new URL(location.href);
  if (lang === 'en') url.searchParams.set('lang', 'en');
  else url.searchParams.delete('lang');
  history.replaceState(null, '', url);
  applyLang(lang);
  if (lastData) renderTable(lastData);
}

applyLang(lang);

const GWGZ_BASE = 'https://niuniu-869.github.io/guwenguanzhi/book/guwenguanzhi/doc/';
const DPSH_URL  = 'https://raw.githubusercontent.com/wenyuange/poem/master/%E8%AF%97%E8%AF%9D/%E4%B8%9C%E5%9D%A1%E8%AF%97%E8%AF%9D.txt';
function bookLink(book, key) {
  const href = book === 'gwgz' ? GWGZ_BASE + key + '/'
             : book === 'dpsh' ? DPSH_URL : null;
  if (!href) return `<span class="tag tag-book">${book}</span>`;
  return `<a class="book-link" href="#" onclick="openModal('${href}');return false"><span class="tag tag-book">${book}</span></a>`;
}

function renderTable(data) {
  lastData = data;
  const t = T[lang];
  const d = data;
  const fontEntries = Object.entries(d['point-font'])
    .flatMap(([book, entries]) => entries.map(r => ({...r, _book: book})))
    .sort((a, b) => a.time < b.time ? -1 : 1);
  const fontTotal = fontEntries.reduce((s, r) => s + r.points, 0);
  const readEntries = Object.entries(d['point-read'])
    .flatMap(([book, lessons]) => Object.entries(lessons).map(([key, val]) => ({key, _book: book, ...val})));
  const readTotal = readEntries.reduce((s, r) => s + r.points, 0);
  const redeemTotal = d.redeem.reduce((s, r) => s + r.points, 0);
  const available = d.total - redeemTotal;
  const isNeg = available < 0;

  const times = [
    ...fontEntries.map(r => r.time),
    ...readEntries.map(r => r.time).filter(Boolean),
    ...d.redeem.map(r => r.time),
  ].sort();
  const lastTime = times[times.length - 1] || '';
  document.getElementById('updated-time').textContent = lastTime ? t.updatedAt(lastTime.slice(0, 10)) : '';

  const fontRows = [...fontEntries].reverse().map(r => {
    const lessonKey = r.name.replace(/_p\d+\.png$/, '');
    const lessonName = lessonKey.replace(/^\d+_/, '');
    const pageTag = r.name.match(/_p(\d+)\.png$/)?.[0].replace('.png', '') || '';
    const href = `${r._book}/html/${lessonKey}.html`;
    return `
    <tr>
      <td class="name-cell"><a href="#" onclick="openModal('${href}');return false">${lessonName}</a><br>
          <a class="time-cell" href="#" onclick="openModal('${r._book}/handin/${r.name}');return false">${pageTag}</a></td>
      <td>${bookLink(r._book, lessonKey)}</td>
      <td class="time-cell">${r.time}</td>
      <td><span class="pts-chip">+${r.points}</span></td>
    </tr>`;
  }).join('');

  const readRows = [...readEntries].reverse().map(r => {
    const name = r.key.replace(/^\d+_/, '');
    const nameCell = r.text ? `<a href="#" onclick="openModal('${r.text}');return false">${name}</a>` : name;
    return `
    <tr>
      <td class="name-cell">${nameCell}</td>
      <td>${bookLink(r._book, r.key)}</td>
      <td class="time-cell">${r.time || ''}</td>
      <td>${t.read.chars(r['no-of-char'])}</td>
      <td><span class="pts-chip">+${r.points}</span></td>
    </tr>`;
  }).join('');

  const redeemRows = [...d.redeem].reverse().map(r => {
    const isBonus = r.points < 0;
    let tag = '';
    if (isBonus) tag = `<span class="tag tag-point">${t.redeem.tags.bonus}</span>`;
    else if (r.halfday) tag = `<span class="tag tag-halfday">${t.redeem.tags.halfday}</span>`;
    else if (r.hour != null) tag = `<span class="tag tag-hour">${t.redeem.tags.hour(r.hour)}</span>`;
    else tag = `<span class="tag tag-point">${t.redeem.tags.point}</span>`;
    const chip = isBonus
      ? `<span class="pts-chip bonus">+${Math.abs(r.points)}</span>`
      : `<span class="pts-chip redeem">-${r.points}</span>`;
    const msg = isBonus ? `🎉 ${r.message || ''}` : (r.message || '');
    return `
    <tr>
      <td class="time-cell">${r.time}</td>
      <td>${tag} ${msg}</td>
      <td>${chip}</td>
    </tr>`;
  }).join('');

  const rulesHtml = t.rules.cells.map(c => `
    <div class="rule-cell">
      <div class="rule-title">${c.title}</div>
      <div class="rule-formula">${c.formula}</div>
      ${c.notes.map(n => typeof n === 'string'
        ? `<div class="rule-note">${n}</div>`
        : `<div class="rule-note" style="${n.style}">${n.text}</div>`
      ).join('')}
    </div>`).join('');

  document.getElementById('root').innerHTML = `
    <div class="summary-bar">
      <div class="stat-card total">
        <div class="label">${t.stats.total}</div>
        <div class="value">${d.total}</div>
      </div>
      <div class="stat-card avail ${isNeg ? 'negative' : ''}">
        <div class="label">${t.stats.available}</div>
        <div class="value">${d.available}</div>
      </div>
    </div>

    <section>
      <div class="section-header"><h2>${t.rules.header}</h2></div>
      <div class="rules-grid">${rulesHtml}</div>
    </section>

    <section>
      <div class="section-header">
        <h2>${t.font.header}</h2>
        <span class="badge">${t.font.badge(fontEntries.length, fontTotal)}</span>
      </div>
      <div class="scroll-body"><table>
        <thead><tr>${t.font.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${fontRows}</tbody>
      </table></div>
    </section>

    <section>
      <div class="section-header">
        <h2>${t.read.header}</h2>
        <span class="badge">${t.read.badge(readEntries.length, readTotal)}</span>
      </div>
      <div class="scroll-body"><table>
        <thead><tr>${t.read.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${readRows || `<tr><td colspan="3" style="color:var(--color-muted);padding:16px">${t.read.empty}</td></tr>`}</tbody>
      </table></div>
    </section>

    <section>
      <div class="section-header">
        <h2>${t.redeem.header}</h2>
        <span class="badge">${t.redeem.badge(d.redeem.length, redeemTotal)}</span>
      </div>
      <div class="scroll-body"><table>
        <thead><tr>${t.redeem.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${redeemRows || `<tr><td colspan="3" style="color:var(--color-muted);padding:16px">${t.redeem.empty}</td></tr>`}</tbody>
      </table></div>
    </section>
  `;
}

fetch('font/points.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(renderTable)
  .catch(err => {
    document.getElementById('root').innerHTML =
      `<div class="error">${T[lang].error(err)}</div>`;
  });

(function () {
  const backdrop = document.getElementById('modal-backdrop');
  const frame    = document.getElementById('modal-frame');
  const img      = document.getElementById('modal-img');
  const canvas   = document.getElementById('modal-canvas');
  const txt      = document.getElementById('modal-text');
  function hideAll() {
    frame.style.display = 'none'; img.style.display = 'none';
    canvas.style.display = 'none'; txt.style.display = 'none';
  }
  window.openModal = function (src) {
    hideAll();
    if (/\.(png|jpe?g|gif|webp)$/i.test(src)) {
      canvas.style.display = 'block';
      canvas.querySelector('.layer-handout').src = src.replace('/handin/', '/handout/');
      canvas.querySelector('.layer-handin').src  = src;
    } else if (/\.txt$/i.test(src)) {
      txt.style.display = 'block';
      fetch(src).then(r => r.text()).then(t => { txt.textContent = t; });
    } else {
      frame.style.display = 'block'; frame.src = src;
    }
    backdrop.classList.remove('hidden');
  };
  function closeModal() {
    backdrop.classList.add('hidden');
    frame.src = 'about:blank'; frame.style.display = 'block';
    img.src = ''; img.style.display = 'none';
    canvas.querySelectorAll('img').forEach(i => i.src = ''); canvas.style.display = 'none';
    txt.textContent = ''; txt.style.display = 'none';
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}());
</script>
</body>
</html>
