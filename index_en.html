<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kexin Points</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #f5f6fa;
      --color-surface: #ffffff;
      --color-border: #e6e8f0;
      --color-text: #1a1a2e;
      --color-muted: #6b7280;
      --color-accent: #5b5ea6;
      --color-accent-light: #ededf8;
      --color-green: #16a34a;
      --color-green-light: #dcfce7;
      --color-amber: #d97706;
      --color-amber-light: #fef3c7;
      --color-red: #dc2626;
      --color-red-light: #fee2e2;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      font-size: 15px;
    }

    header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--color-accent); }
    header .updated { margin-left: auto; font-size: 12px; color: var(--color-muted); }
    header .lang-link { margin-left: 16px; font-size: 12px; color: var(--color-accent); text-decoration: none; border: 1px solid var(--color-accent); border-radius: 10px; padding: 2px 10px; }
    header .lang-link:hover { background: var(--color-accent-light); }

    .scroll-body { max-height: 320px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .scroll-body thead th { position: sticky; top: 0; z-index: 1; }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-card .label { font-size: 13px; color: var(--color-muted); margin-bottom: 4px; }
    .stat-card .value { font-size: 36px; font-weight: 700; line-height: 1.1; }
    .stat-card.total .value  { color: var(--color-accent); }
    .stat-card.avail .value  { color: var(--color-green); }
    .stat-card.avail.negative .value { color: var(--color-red); }

    section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: clip;
    }
    .section-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header h2 { font-size: 15px; font-weight: 600; }
    .section-header .badge {
      margin-left: auto;
      font-size: 12px;
      background: var(--color-accent-light);
      color: var(--color-accent);
      border-radius: 12px;
      padding: 2px 10px;
      font-weight: 600;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .rule-cell {
      padding: 16px 20px;
      border-right: 1px solid var(--color-border);
    }
    .rule-cell:last-child { border-right: none; }
    .rule-cell .rule-title { font-size: 12px; color: var(--color-muted); margin-bottom: 6px; }
    .rule-cell .rule-formula { font-size: 14px; font-weight: 600; color: var(--color-text); }
    .rule-cell .rule-note { font-size: 12px; color: var(--color-muted); margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--color-muted);
      border-bottom: 1px solid var(--color-border);
      background: #fafbfc;
    }
    tbody tr { border-bottom: 1px solid var(--color-border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 10px 16px; font-size: 14px; }
    tbody tr:hover { background: #fafbfc; }

    .pts-chip {
      display: inline-block;
      background: var(--color-accent-light);
      color: var(--color-accent);
      border-radius: 10px;
      padding: 1px 9px;
      font-size: 13px;
      font-weight: 600;
    }
    .pts-chip.redeem {
      background: var(--color-red-light);
      color: var(--color-red);
    }

    .loading { padding: 32px; text-align: center; color: var(--color-muted); }
    .error   { padding: 20px; color: var(--color-red); }

    .name-cell { font-family: ui-monospace, monospace; font-size: 13px; }
    .name-cell a { color: var(--color-accent); text-decoration: none; }
    .name-cell a:hover { text-decoration: underline; }
    .time-cell { color: var(--color-muted); font-size: 13px; white-space: nowrap; }
    .tag {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 8px;
      font-weight: 600;
    }
    .tag-halfday { background: var(--color-amber-light); color: var(--color-amber); }
    .tag-hour    { background: var(--color-green-light); color: var(--color-green); }
    .tag-point   { background: var(--color-accent-light); color: var(--color-accent); }

    @media (max-width: 600px) {
      .rules-grid { grid-template-columns: 1fr; }
      .rule-cell { border-right: none; border-bottom: 1px solid var(--color-border); }
      .rule-cell:last-child { border-bottom: none; }
      .summary-bar { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Kexin Points</h1>
  <span class="updated" id="updated-time"></span>
  <a class="lang-link" href="index.html">中文</a>
</header>

<main>
  <div id="root"><div class="loading">Loading…</div></div>
</main>

<script>
function renderTable(data) {
  const d = data;
  const fontEntries = Object.entries(d['point-font'])
    .flatMap(([book, entries]) => entries.map(r => ({...r, _book: book})))
    .sort((a, b) => a.time < b.time ? -1 : 1);
  const fontTotal = fontEntries.reduce((s, r) => s + r.points, 0);
  const readEntries = Object.entries(d['point-read'])
    .flatMap(([, lessons]) => Object.entries(lessons).map(([key, val]) => ({key, ...val})));
  const readTotal = readEntries.reduce((s, r) => s + r.points, 0);
  const redeemTotal = d.redeem.reduce((s, r) => s + r.points, 0);
  const available = d.total - redeemTotal;
  const isNeg = available < 0;

  const times = [
    ...fontEntries.map(r => r.time),
    ...d.redeem.map(r => r.time),
  ].sort();
  const lastTime = times[times.length - 1] || '';
  document.getElementById('updated-time').textContent = lastTime ? 'Updated ' + lastTime.slice(0, 10) : '';

  const fontRows = [...fontEntries].reverse().map(r => {
    const lessonKey = r.name.replace(/_p\d+\.png$/, '');
    const lessonName = lessonKey.replace(/^\d+_/, '');
    const pageTag = r.name.match(/_p(\d+)\.png$/)?.[0].replace('.png', '') || '';
    const href = `${r._book}/html/${lessonKey}.html`;
    return `
    <tr>
      <td class="name-cell"><a href="${href}" target="_blank">${lessonName}</a><br>
          <span class="time-cell">${pageTag}</span></td>
      <td class="time-cell">${r.time}</td>
      <td><span class="pts-chip">+${r.points}</span></td>
    </tr>`;
  }).join('');

  const readRows = [...readEntries].reverse().map(r => `
    <tr>
      <td>${r.key.replace(/^\d+_/, '')}</td>
      <td>${r['no-of-char']} chars</td>
      <td><span class="pts-chip">+${r.points}</span></td>
    </tr>`).join('');

  const redeemRows = [...d.redeem].reverse().map(r => {
    let tag = '';
    if (r.halfday) tag = '<span class="tag tag-halfday">half-day</span>';
    else if (r.hour != null) tag = `<span class="tag tag-hour">${r.hour}h</span>`;
    else tag = '<span class="tag tag-point">pts</span>';
    return `
    <tr>
      <td class="time-cell">${r.time}</td>
      <td>${tag} ${r.message || ''}</td>
      <td><span class="pts-chip redeem">-${r.points}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('root').innerHTML = `
    <div class="summary-bar">
      <div class="stat-card total">
        <div class="label">Total Points</div>
        <div class="value">${d.total}</div>
      </div>
      <div class="stat-card avail ${isNeg ? 'negative' : ''}">
        <div class="label">Available</div>
        <div class="value">${d.available}</div>
      </div>
    </div>

    <section>
      <div class="section-header"><h2>Scoring Rules</h2></div>
      <div class="rules-grid">
        <div class="rule-cell">
          <div class="rule-title">Calligraphy</div>
          <div class="rule-formula">1 pt per character</div>
          <div class="rule-note">Counted by characters completed per page</div>
        </div>
        <div class="rule-cell">
          <div class="rule-title">Reading</div>
          <div class="rule-formula">⌈characters ÷ 20⌉ pts</div>
          <div class="rule-note">Rounded up; minimum 1 pt</div>
        </div>
        <div class="rule-cell">
          <div class="rule-title">Redeem</div>
          <div class="rule-formula">Half-day: 60 pts · Per hour: 36 pts</div>
          <div class="rule-note">Weekdays: max 2 hrs cumulative per week</div>
          <div class="rule-note">Weekends: max one half-day per week</div>
          <div class="rule-note" style="padding-left:8px">↳ Approved for the rest of the day from 4:00 PM</div>
        </div>
      </div>
    </section>

    <section>
      <div class="section-header">
        <h2>Calligraphy Log</h2>
        <span class="badge">${fontEntries.length} sessions · ${fontTotal} pts</span>
      </div>
      <div class="scroll-body"><table>
        <thead><tr><th>Lesson</th><th>Date</th><th>Points</th></tr></thead>
        <tbody>${fontRows}</tbody>
      </table></div>
    </section>

    <section>
      <div class="section-header">
        <h2>Reading Log</h2>
        <span class="badge">${readEntries.length} texts · ${readTotal} pts</span>
      </div>
      <div class="scroll-body"><table>
        <thead><tr><th>Text</th><th>Characters</th><th>Points</th></tr></thead>
        <tbody>${readRows || '<tr><td colspan="3" style="color:var(--color-muted);padding:16px">No entries yet</td></tr>'}</tbody>
      </table></div>
    </section>

    <section>
      <div class="section-header">
        <h2>Game Time Redemption</h2>
        <span class="badge">${d.redeem.length} redemptions · ${redeemTotal} pts</span>
      </div>
      <div class="scroll-body"><table>
        <thead><tr><th>Date</th><th>Note</th><th>Points</th></tr></thead>
        <tbody>${redeemRows || '<tr><td colspan="3" style="color:var(--color-muted);padding:16px">No entries yet</td></tr>'}</tbody>
      </table></div>
    </section>
  `;
}

fetch('font/points.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(renderTable)
  .catch(err => {
    document.getElementById('root').innerHTML =
      `<div class="error">Failed to load font/points.json (${err})</div>`;
  });
</script>
</body>
</html>
